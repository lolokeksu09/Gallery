name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify APK permissions
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > permissions.txt
          cat permissions.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|MANAGE_EXTERNAL_STORAGE|ACCESS_FINE_LOCATION|CAMERA|RECORD_AUDIO)" permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            permissions.txt
          if-no-files-found: error
          retention-days: 30
